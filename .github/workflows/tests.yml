name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python tools/install_xray.py --destination /tmp/v2ray-desk-xray
      - run: python -m pytest -q
        env:
          XRAY_TEST_BIN: /tmp/v2ray-desk-xray
